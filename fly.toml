app = "tobori"

primary_region = "dfw"

[mounts]
  source = "tobori_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1


    
[vm]
  cpu_kind  = "shared"   # options: "shared", "performance"
  cpus      = 2          # was 1
  memory_mb = 1024       # was 256

[env]
  COOKIE_SECURE = "true"
